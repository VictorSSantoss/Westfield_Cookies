<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="./resources/css/style.css">
    <link rel="icon" type="image/favicon.svg-icon" href="./resources/img/logo 1.1.svg">
    <!-- ADD DIFFERENT FAVICONS LATER
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="images/android-chrome-192x192.png">

    tip: there are free online tools (like realfavicongenerator.net) that take one image (usually 512×512) and generate all the needed sizes + HTML for you.
 -->
    <title>Westfild Cookies</title>
</head>
<body>
    
<!-- Nav Section -->
    <nav class="nav-section">
        <div class="logo">
            <img src="./resources/img/logotipo 1.2.svg" alt="Westfild Cookies logo">
        </div>
        <ul class="nav-button-list">
            <p class="nav-p">home</p>
            <p class="nav-p">about</p>
            <button class="nav-button">Contact</button>
        </ul>
    </nav>

<!-- Main Content -->
    <div class="banner">
        <div class="banner-img">
            <img class="cookie-1" src="./resources/img/Oreo - Transparent Background.svg" alt="Image of cookie">
            <img class="cookie-2" src="./resources/img/Classic - Transparent Background.svg" alt="Image of cookie">
        </div>
        <div class="banner-text">
            <img src="./resources/img/adesivo 5.svg" alt="Sticker image">
            <h1>Welcome to Westfild Cookies</h1>
            <p>Discover the best cookies in town, made with love and the finest ingredients.</p>
            <button class="banner-button" >Order Now</button>
        </div>
    </div>

<!-- Catalog -->
    <div class="catalog">
        <img src="./resources/img/Waves 1.1.svg" alt="Waves in the background">
        <h2>Catalog goes here</h2>
    </div>
</body>
</html>
